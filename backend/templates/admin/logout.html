{% extends "admin/base_site.html" %}
{% load i18n %}
{% block breadcrumbs %}{% endblock %}
{% block content %}
<section class="data-card center-card">
  <div class="data-card-content">
    <div class="center-card__icon"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
    <h1 class="page-title" style="font-size:1.45rem!important;">Déconnexion</h1>
    <p class="page-subtitle" style="margin:.55rem auto 1.25rem;">Voulez-vous vraiment quitter l'espace d'administration ?</p>
    <form action="{% url 'admin:logout' %}" method="post" style="display:grid;gap:.55rem;">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary w-full"><i class="fa-solid fa-arrow-right-from-bracket"></i>Se déconnecter</button>
      <a href="{% url 'admin:index' %}" class="btn w-full"><i class="fa-solid fa-arrow-left"></i>Rester dans l'administration</a>
    </form>
  </div>
</section>
{% endblock %}
