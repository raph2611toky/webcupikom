{% extends "emails/base.html" %}
{% block title %}Compte supprimé{% endblock %}
{% block content %}
  <p style="margin:0 0 12px;color:#64748b;font-size:15px;">Bonjour {{ display_name }},</p>
  <h1 style="margin:0 0 14px;font-size:26px;color:#111827;">Votre compte a été supprimé</h1>
  <p style="margin:0;color:#64748b;line-height:1.7;">La suppression de votre compte {{ site_name }} a été effectuée. Cet email sert de confirmation.</p>
{% endblock %}
