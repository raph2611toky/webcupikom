{% extends "emails/base.html" %}
{% block title %}Code de vérification{% endblock %}
{% block content %}
  <p style="margin:0 0 12px;color:#64748b;font-size:15px;">Bonjour {{ display_name|default:"" }},</p>
  <h1 style="margin:0 0 14px;font-size:26px;color:#111827;">Votre code de vérification</h1>
  <p style="margin:0 0 20px;color:#64748b;line-height:1.7;">Utilisez ce code uniquement dans l'application {{ site_name }}.</p>
  <div style="margin:24px auto;padding:16px 20px;max-width:260px;text-align:center;border:2px solid #c7d2fe;border-radius:12px;background:#eef2ff;color:#3730a3;font-size:30px;font-weight:800;letter-spacing:.18em;">{{ code_otp }}</div>
  <p style="margin:20px 0 0;color:#94a3b8;font-size:12px;">Ne partagez jamais ce code.</p>
{% endblock %}
